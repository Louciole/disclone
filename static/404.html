</div>

<script>
    (function() {
        const container = document.getElementById('dvd-container');
        const svg = document.getElementById('dvd-svg');
        const bounceSpan = document.getElementById('bounce-count');
        const posX = document.getElementById('pos-x');
        const posY = document.getElementById('pos-y');

        const LOGO_WIDTH = 160;
        const LOGO_HEIGHT = 96;

        let x = Math.random() * (window.innerWidth - LOGO_WIDTH);
        let y = Math.random() * (window.innerHeight - LOGO_HEIGHT);
        let xSpeed = 2.4;
        let ySpeed = 2.4;
        let bounces = 0;

        const colors = [
            '#FFFFFF',
            '#FF3E00',
            '#00FF88',
            '#FF00FF',
            '#FFFF00',
            '#00CCFF'
        ];

        function changeColor() {
            const newColor = colors[Math.floor(Math.random() * colors.length)];
            svg.style.color = newColor;
            bounces++;
            if (bounceSpan) bounceSpan.innerText = bounces.toString().padStart(3, '0');
        }

        function animate() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const dvdWidth = container.offsetWidth;
            const dvdHeight = container.offsetHeight;

            x += xSpeed;
            y += ySpeed;

            let hit = false;

            if (x + dvdWidth >= width || x <= 0) {
                xSpeed *= -1;
                x = x <= 0 ? 0 : width - dvdWidth;
                hit = true;
            }

            if (y + dvdHeight >= height || y <= 0) {
                ySpeed *= -1;
                y = y <= 0 ? 0 : height - dvdHeight;
                hit = true;
            }

            if (hit) {
                changeColor();
            }

            container.style.transform = `translate3d(${x}px, ${y}px, 0)`;

            if (posX) posX.innerText = Math.round(x);
            if (posY) posY.innerText = Math.round(y);

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            x = Math.min(x, window.innerWidth - container.offsetWidth);
            y = Math.min(y, window.innerHeight - container.offsetHeight);
        });

        svg.style.color = colors[Math.floor(Math.random() * colors.length)];
        animate();
    })();
</script>

</html>
