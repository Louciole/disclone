<div class="call-participant status-${element.status || 'active'}"
     id="participant-${element.userId}"
     title="${global.users[element.userId]?.display || 'User'}"
     style="background: hsl(${(element.userId * 137.508) % 360}, 45%, 25%);">
    <div class="participant-avatar" id="avatar-${element.userId}">
        <img src="/static/attachments/${global.users[element.userId]?.pfp}" alt="${global.users[element.userId]?.display || 'User'}">
    </div>

    <div class="participant-status-ring"></div>

    <video id="remote-video-${element.userId}" autoplay playsinline></video>

    <div class="participant-name-label">${global.users[element.userId]?.display || 'User'}</div>

    <div class="participant-status-text">${_t("Appel en cours")}...</div>
</div>
