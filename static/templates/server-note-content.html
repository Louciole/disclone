<div class="selected-info">
    <div class="title">
        <img class="icon" src="/static/icons/material/note.svg"/>
        ${Subscribe("global.convs["+global.state.activeConv+"].name", ()=>{return global.convs[global.state.activeConv].name})}
    </div>
</div>


<div class="" style="width: 100%;height: calc(100svh - 3rem);">
    <div class="editor" id="note-editor">
        ${fillWith('note-block', global.state.noteEditor.getSortedBlocks())}
    </div>
</div>
