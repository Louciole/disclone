<div id="server-infos">
    <h1>${global.state.currentServer?.name}</h1><div class="icon">></div>
</div>
<div id="drag-wrapper"></div>
<div class="scrollable" id="server-selector" ondrop="dropSnippet(event)" ondragover="allowSnippetDrop(event)">
    ${Subscribe("global.state.currentServer['displayed-dirs']",() => fillWith('server-category',global.state.currentServer["displayed-dirs"] ? global.state.currentServer["displayed-dirs"] : []))}
</div>
