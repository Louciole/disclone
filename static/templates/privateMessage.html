<div id="search">
    <label>
        <input type="text" placeholder="${_t('Rechercher/lancer une conversation')}">
    </label>
</div>
<div class="scrollable">
    <div id="friendCat" class="item selected" onclick="goToFriends(event)">
        <img class="icon" src="/static/icons/material/group.svg" style="margin-right:1rem">
        <p>${_t("Amis")}</p>
    </div>
    <div id="message-menu">
        <h2>${_t("MESSAGES PRIVÉS")}</h2>
        <div class="icon">+</div>
        <span class="tooltip bottom">${_t("Créer un MP")}</span>
    </div>
    ${Subscribe('global.privateConvs',()=>fillWith('conversation_element',Object.values(global.privateConvs).sort((a,b)=>String(b.last_activity||'').localeCompare(String(a.last_activity||'')))))}
</div>
