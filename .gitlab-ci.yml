stages:
  - test
  - build

test:
  stage: test
  image: python:3.11-slim-bookworm
  script:
    - echo 'Running tests...'
    - apt-get update && apt-get install -y git && apt-get install -y gcc
    - apt install -y libpq-dev
    - python -m venv venv
    - source venv/bin/activate
    - pip install -r requirements.txt
    - vesta test


build-apk:
  stage: build
  image: mingc/android-build-box:latest

  rules:
    - if: '$CI_COMMIT_BRANCH == "maine"'

  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
    GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.incremental=false"

  cache:
    key: "project-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/wrapper
      - .gradle/caches

  script:
    - cd capacitor-app
    - npm install
    - mkdir -p android/app
    - echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/mycelium.keystore
    - npx cap sync android
    - cd android
    - chmod +x gradlew
    - |
      ./gradlew assembleRelease \
        -Pandroid.injected.signing.store.file="$CI_PROJECT_DIR/capacitor-app/android/app/mycelium.keystore" \
        -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
        -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
        -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
    - cp app/build/outputs/apk/release/*.apk "$CI_PROJECT_DIR/mycelium-release.apk"

  artifacts:
    name: "mycelium-release"
    paths:
      - mycelium-release.apk
    expire_in: 2 week