apply plugin: 'com.android.application'

android {
    namespace = "dev.carbonlab.mycelium.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.carbonlab.mycelium.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI can inject versions through Gradle properties; local builds use defaults.
        def injectedVersionCode = (project.findProperty("VERSION_CODE") ?: "1").toInteger()
        def injectedVersionName = project.findProperty("VERSION_NAME") ?: "1.0.0"
        versionCode injectedVersionCode
        versionName injectedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Driven by env vars (CI) or -P gradle properties (local). Guarded so
            // debug/unsigned builds without a keystore still work.
            def ksPath = System.getenv("ANDROID_KEYSTORE_FILE") ?: project.findProperty("ANDROID_KEYSTORE_FILE")
            if (ksPath != null && !ksPath.toString().trim().isEmpty()) {
                storeFile file(ksPath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: project.findProperty("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: project.findProperty("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: project.findProperty("ANDROID_KEY_PASSWORD")
                // Force modern signature schemes. v2 is REQUIRED to install on
                // Android 11+ (API 30+); v1-only APKs fail with "package invalid".
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Only attach when a keystore is actually configured (so the AAB/Play
            // jobs that still pass -Pandroid.injected.signing.* keep working and
            // local unsigned builds don't break).
            def ksPath = System.getenv("ANDROID_KEYSTORE_FILE") ?: project.findProperty("ANDROID_KEYSTORE_FILE")
            if (ksPath != null && !ksPath.toString().trim().isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Needed to subclass FirebaseMessagingService (MyceliumMessagingService).
    // Pinned to the same version the @capacitor/push-notifications plugin uses
    // so there is no FCM version conflict.
    implementation "com.google.firebase:firebase-messaging:25.0.1"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
